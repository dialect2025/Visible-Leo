const MAP_SCALE=1000/((LON_E-LON_W)*RAD);
const MX=lon=>(lon-LON_W)*RAD*MAP_SCALE;
const MY=lat=>(MERC(LAT_N)-MERC(lat))*MAP_SCALE;
function vbOf(r){const x0=MX(r.lon[0]),x1=MX(r.lon[1]),y0=MY(r.lat[1]),y1=MY(r.lat[0]);return[x0,y0,x1-x0,y1-y0];}

  function drawGeo(geo){
    gLand.innerHTML=''; gLabel.innerHTML=''; labelEls.length=0;
    const isCity=cfg.geo!=='china';
    geo.features.forEach(f=>{
      const d=geomToPath(f.geometry); if(!d)return;
      const p=el('path',{class:'land',d});
      p.appendChild(el('title',{})).textContent=f.properties.name||'';
      gLand.appendChild(p);
    });
    geo.features.forEach(f=>{
      const nm=f.properties.name||'';
      if(!isCity&&SKIP_LABEL.has(nm))return;
      const c=f.properties.center||f.properties.cp||centroidOf(f.geometry); if(!c)return;
      const fs=isCity?8:10.5;
      const t=el('text',{class:'plabel',x:MX(c[0]),y:MY(c[1]),'font-size':fs});
      t.dataset.fs=String(fs);
      t.textContent=isCity?shortCityName(nm):shortProvName(nm);
      gLabel.appendChild(t); labelEls.push(t);
    });
    if(curVB)render();
  }
  loadGeo(cfg.geo).then(geo=>{
    if(geo){drawGeo(geo);if(loadingEl){loadingEl.style.opacity=0;setTimeout(()=>{if(loadingEl.parentNode)loadingEl.remove();},400);}}
    else if(loadingEl){loadingEl.textContent='底图加载失败（请检查网络）';}
  });

  /* 府/州：虚线圈 + 治所名 */
  function buildMarkups(){
    if(!cfg.fuxian)return;
    Object.keys(cfg.fuxian).forEach(k=>{
      const pts=cfg.fuxian[k].pts, c=pts[0];
      const grp=groupOf(cfg.fuxian[k].code,cfg.groups);
      const color=GROUPS1[grp]?GROUPS1[grp].color:'#94a3b8';
      const cx=MX(c[1]),cy=MY(c[2]),r=11;
      gMark.appendChild(el('circle',{cx,cy,r,
        fill:color,'fill-opacity':.05,stroke:color,'stroke-opacity':.5,
        'stroke-width':1,'stroke-dasharray':'3 3','vector-effect':'non-scaling-stroke'}));
      const t=el('text',{class:'mlabel',x:cx+r+2.5,y:cy-r+2,
        fill:color,'fill-opacity':.85,'font-size':8.5,'dominant-baseline':'middle'});
      t.dataset.fs='8.5'; t.textContent=k;
      gMark.appendChild(t); labelEls.push(t);
    });
  }

  /* 主体气泡：同坐标环形偏移 */
  function buildBubbles(){
    gBub.innerHTML=''; bubbles.length=0;
    const byPos={};
    cfg.points.forEach((d,i)=>{
      const key=d[1].toFixed(4)+','+d[2].toFixed(4);
      (byPos[key]=byPos[key]||[]).push(i);
    });
    const offs=new Array(cfg.points.length).fill(null);
    Object.values(byPos).forEach(list=>{
      list.forEach((idx,k)=>{
        if(list.length===1){offs[idx]=[0,0];return;}
        const ring=Math.floor(k/6);
        const ang=(k%6)*Math.PI/3+ring*0.55;
        const rr=cfg.spread*(0.9+ring*0.8);
        offs[idx]=[Math.cos(ang)*rr,Math.sin(ang)*rr];
      });
    });
    cfg.points.forEach((d,i)=>{
      const [name,lon,lat,code,note]=d;
      const grp=groupOf(code,cfg.groups);
      const color=grp?cfg.groups[grp].color:'#94a3b8';
      const [ox,oy]=offs[i];
      const x=MX(lon)+ox, y=MY(lat)+oy;
      const g=el('g',{class:'bub','data-i':i});
      const body=el('circle',{class:'body',cx:0,cy:0,r:cfg.baseR,
        fill:color,'fill-opacity':note?.12:.35,
        stroke:color,'stroke-opacity':note?.7:.95,
        'stroke-dasharray':note?'2.2 2.2':'none'});
      const hit=el('circle',{class:'hit',cx:0,cy:0,r:cfg.baseR+5});
      g.append(body,hit); gBub.appendChild(g);
      bubbles.push({g,body,hit,name,lon,lat,code,grp,note,color,x,y,i});
    });
  }

  /* 府辖县：实心小点，与主体同 code，note 记府名 */
  function buildFuxian(){
    if(!cfg.fuxian)return;
    Object.keys(cfg.fuxian).forEach(fname=>{
      const code=cfg.fuxian[fname].code;
      const grp=groupOf(code,cfg.groups);
      const color=grp?cfg.groups[grp].color:'#94a3b8';
      cfg.fuxian[fname].pts.forEach(p=>{
        const [name,lon,lat]=p;
        const x=MX(lon), y=MY(lat);
        const g=el('g',{class:'bub'});
        const body=el('circle',{class:'body',cx:0,cy:0,r:cfg.baseR*.82,
          fill:color,'fill-opacity':.28,
          stroke:color,'stroke-opacity':.8,'stroke-width':.9});
        const hit=el('circle',{class:'hit',cx:0,cy:0,r:cfg.baseR+4});
        g.append(body,hit); gBub.appendChild(g);
        bubbles.push({g,body,hit,name,lon,lat,code,grp,note:fname+'辖',color,x,y,isFuxian:true});
      });
    });
  }

  /* 泛称区域：按县市逐一落点，小虚线圆圈 */
  function buildZones(){
    if(!cfg.zones)return;
    cfg.zones.forEach(z=>{
      const grp=groupOf(z.code,cfg.groups);
      const color=grp?cfg.groups[grp].color:'#94a3b8';
      z.pts.forEach(p=>{
        const [name,lon,lat]=p;
        const x=MX(lon), y=MY(lat);
        const g=el('g',{class:'bub'});
        const body=el('circle',{class:'body',cx:0,cy:0,r:2.8,
          fill:color,'fill-opacity':.18,
          stroke:color,'stroke-opacity':.5,
          'stroke-width':.8,'stroke-dasharray':'1.6 1.6'});
        const hit=el('circle',{class:'hit',cx:0,cy:0,r:6});
        g.append(body,hit); gBub.appendChild(g);
        bubbles.push({g,body,hit,name,lon,lat,code:z.code,grp,note:'',color,x,y,isZone:true,zoneLabel:z.label});
      });
      const lx=MX(z.center[0]), ly=MY(z.center[1]);
      const lt=el('text',{class:'zonelabel',x:lx,y:ly,
        fill:color,'fill-opacity':.85,'font-size':10,'font-weight':600});
      lt.dataset.fs='10'; lt.textContent=z.label;
      gMark.appendChild(lt); labelEls.push(lt);
    });
  }

  function render(){
    if(!curVB)return;
    svg.setAttribute('viewBox',curVB.join(' '));
    wrap.style.aspectRatio=curVB[2]+' / '+curVB[3];
    const s=curVB[2]/1000;
    bubbles.forEach(b=>b.g.setAttribute('transform',`translate(${b.x},${b.y}) scale(${s})`));
    labelEls.forEach(t=>{
      const base=parseFloat(t.dataset.fs||'10.5');
      t.setAttribute('font-size',(base*s).toFixed(2));
    });
  }
  function setView(vb){curVB=vb.slice();render();}

  Object.keys(cfg.views).forEach(k=>{
    const btn=document.createElement('button');
    btn.textContent=k;
    if(k===cfg.defaultView)btn.classList.add('on');
    btn.addEventListener('click',()=>{
      [...viewsEl.children].forEach(b=>b.classList.remove('on'));
      btn.classList.add('on'); setView(vbOf(cfg.views[k]));
    });
    viewsEl.appendChild(btn);
  });

  Object.keys(cfg.groups).forEach(g=>{
    const info=cfg.groups[g];
    const cnt=cfg.points.filter(p=>groupOf(p[3],cfg.groups)===g).length
      + (cfg.fuxian?Object.values(cfg.fuxian).filter(f=>groupOf(f.code,cfg.groups)===g).reduce((s,f)=>s+f.pts.length,0):0)
      + (cfg.zones?cfg.zones.filter(z=>groupOf(z.code,cfg.groups)===g).reduce((s,z)=>s+z.pts.length,0):0);
    const lg=document.createElement('div');
    lg.className='lg';
    lg.innerHTML=`<i style="background:${info.color}"></i>
      <span class="nm">${info.name}</span><span class="vv">${info.val}</span><span class="ct">${cnt}</span>`;
    lg.addEventListener('click',()=>{hiddenGroup[g]=!hiddenGroup[g];lg.classList.toggle('off',!!hiddenGroup[g]);applyFilter();});
    legendEl.appendChild(lg);
  });

  function applyFilter(){
    const q=searchState.v;
    bubbles.forEach(b=>{
      let show=!hiddenGroup[b.grp];
      if(show&&q){
        const hay=(b.name+' '+b.code+' '+(cfg.variants[b.code]||'')+' '+(b.note||'')+' '+(b.zoneLabel||'')).toLowerCase();
        show=hay.indexOf(q)!==-1;
      }
      if(show&&hiKey)show=(hiMode==='code')?(b.code===hiKey):(b.grp===hiKey);
      b.g.classList.toggle('dim',!show);
    });
  }
  searchEl.addEventListener('input',e=>{searchState.v=e.target.value.trim().toLowerCase();applyFilter();});

  function showTip(ev,b){
    const info=cfg.groups[b.grp]||{name:b.grp,color:'#94a3b8'};
    let html=`<div class="t">${b.name}</div>`;
    if(b.isZone){
      html+=`<div><span class="k">泛称区</span><span class="v">${b.zoneLabel}</span></div>`;
      html+=`<div style="margin-top:3px;color:#94a3b8;font-size:11.5px;white-space:normal;max-width:260px">该区未明确排除者默认属此读音。</div>`;
    }else{
      const val=cfg.variants[b.code]||'—';
      html+=`<div><span class="k">音值</span><span class="v vv" style="color:${info.color}">${val}</span>`
        +`<span class="badge" style="color:${info.color}">${b.code}</span></div>`;
      html+=`<div><span class="k">所属</span><span class="v">${info.name}</span></div>`;
      if(b.note)html+=`<div style="margin-top:3px;color:#94a3b8;font-size:11.5px;white-space:normal;max-width:260px">${b.note}</div>`;
    }
    tip.innerHTML=html;
    const rect=wrap.getBoundingClientRect();
    tip.style.opacity=1;
    let x=ev.clientX-rect.left+16, y=ev.clientY-rect.top+16;
    const tw=tip.offsetWidth,th=tip.offsetHeight;
    if(x+tw>rect.width-8)x=ev.clientX-rect.left-tw-16;
    if(y+th>rect.height-8)y=ev.clientY-rect.top-th-16;
    tip.style.transform=`translate(${Math.max(4,x)}px, ${Math.max(4,y)}px)`;
  }
  const hideTip=()=>{tip.style.opacity=0;};
  gBub.addEventListener('mouseover',e=>{const g=e.target.closest('.bub');if(!g)return;const b=bubbles.find(x=>x.g===g);if(b)showTip(e,b);});
  gBub.addEventListener('mousemove',e=>{const g=e.target.closest('.bub');if(!g)return;const b=bubbles.find(x=>x.g===g);if(b)showTip(e,b);});
  gBub.addEventListener('mouseout',e=>{if(e.target.closest('.bub'))hideTip();});

  function buildRank(){
    const cnt={}; let list;
    if(cfg.rankBy==='code'){
      cfg.points.forEach(p=>{cnt[p[3]]=(cnt[p[3]]||0)+1;});
      list=Object.keys(cnt).map(k=>({key:k,n:cnt[k],grp:groupOf(k,cfg.groups)})).sort((a,b)=>b.n-a.n).slice(0,15);
    }else{
      cfg.points.forEach(p=>{const g=groupOf(p[3],cfg.groups);cnt[g]=(cnt[g]||0)+1;});
      list=Object.keys(cnt).map(k=>({key:k,n:cnt[k],grp:k})).sort((a,b)=>b.n-a.n);
    }
    const max=list.length?list[0].n:1;
    rankEl.innerHTML=list.map((d,i)=>{
      const info=cfg.groups[d.grp]||{name:d.grp,val:'',color:'#94a3b8'};
      const w=(d.n/max)*100;
      if(cfg.rankBy==='code'){
        return `<li data-key="${d.key}" data-mode="code">
          <div class="bar" style="width:${w}%;background:${info.color}"></div>
          <span class="nm">${i+1}. <b style="color:${info.color}">${cfg.variants[d.key]||d.key}</b><em>${d.key}</em></span>
          <span class="nu">${d.n} 处</span></li>`;
      }
      return `<li data-key="${d.key}" data-mode="group">
        <div class="bar" style="width:${w}%;background:${info.color}"></div>
        <span class="nm">${i+1}. <b style="color:${info.color}">${info.name}</b><em>${info.val}</em></span>
        <span class="nu">${d.n} 处</span></li>`;
    }).join('');
    rankEl.querySelectorAll('li').forEach(li=>{
      li.addEventListener('click',()=>{
        const key=li.dataset.key,mode=li.dataset.mode;
        if(hiKey===key&&hiMode===mode){hiKey=null;hiMode=null;}else{hiKey=key;hiMode=mode;}
        rankEl.querySelectorAll('li').forEach(x=>x.classList.toggle('sel',x.dataset.key===hiKey&&x.dataset.mode===hiMode));
        applyFilter();
      });
    });
  }

  function buildNoplace(){
    noplaceEl.innerHTML='';
    (cfg.noplace||[]).forEach(item=>{
      const li=document.createElement('li');
      if(item.code){
        const grp=groupOf(item.code,cfg.groups);
        const color=grp?cfg.groups[grp].color:'#94a3b8';
        li.innerHTML=`<b style="color:${color};font-family:'Charis SIL','Doulos SIL',serif">${cfg.variants[item.code]||item.code}</b>
          <span style="color:#7c8899">${item.code}</span><br>${item.text}`;
        li.classList.add('click');
        li.addEventListener('click',()=>{
          if(hiKey===item.code&&hiMode==='code'){hiKey=null;hiMode=null;}else{hiKey=item.code;hiMode='code';}
          rankEl.querySelectorAll('li').forEach(x=>x.classList.toggle('sel',x.dataset.key===hiKey&&x.dataset.mode===hiMode));
          applyFilter();
        });
      }else{li.innerHTML=item.text;}
      noplaceEl.appendChild(li);
    });
  }

  function buildStats(){
    let cards;
    const fuxianCount=cfg.fuxian?Object.values(cfg.fuxian).reduce((s,f)=>s+f.pts.length,0):0;
    const zoneCount=cfg.zones?cfg.zones.reduce((s,z)=>s+z.pts.length,0):0;
    if(cfg.id==='p1'){
      const codes=Object.keys(cfg.variants).length;
      const g={};
      cfg.points.forEach(p=>{const k=groupOf(p[3],cfg.groups);g[k]=(g[k]||0)+1;});
      Object.values(cfg.fuxian||{}).forEach(f=>{const k=groupOf(f.code,cfg.groups);g[k]=(g[k]||0)+f.pts.length;});
      Object.values(cfg.zones||{}).forEach(z=>{const k=groupOf(z.code,cfg.groups);g[k]=(g[k]||0)+z.pts.length;});
      const topG=Object.keys(g).sort((a,b)=>g[b]-g[a])[0];
      cards=[
        ['定点方言点',cfg.points.length+' 处'],
        ['府辖县',fuxianCount+' 点'],
        ['泛称区落点',zoneCount+' 点'],
        ['音变变体',codes+' 支'],
        ['最大组',`${cfg.groups[topG].name} · ${g[topG]} 点`]
      ];
    }else if(cfg.id==='p2'){
      const n1=cfg.points.filter(p=>p[3]==='N1').length;
      const n0=cfg.points.filter(p=>p[3]==='N0').length;
      cards=[['定点',cfg.points.length+' 处'],['读 niou~niəu',n1+' 处'],['读 iou~iəu',n0+' 处'],
        ['零声母区占比',(n0/cfg.points.length*100).toFixed(1)+'%']];
    }else if(cfg.id==='p3'){
      cards=[['定点记录',cfg.points.length+' 条'],['涉及字',Object.keys(cfg.groups).length+' 个'],
        ['覆盖县市',new Set(cfg.points.map(p=>p[0])).size+' 处'],['无定点字','孽 · 蔫']];
    }else{
      const c={};
      cfg.points.forEach(p=>{const g=groupOf(p[3],cfg.groups);c[g]=(c[g]||0)+1;});
      const top=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];
      cards=[['定点',cfg.points.length+' 处'],['类别',Object.keys(cfg.groups).length+' 类'],
        ['最密一类',`${cfg.groups[top].name} · ${c[top]} 点`]];
    }
    statsEl.innerHTML=cards.map(([t,v])=>`<div class="stat"><b>${v}</b><span>${t}</span></div>`).join('');
  }

  (function enablePanZoom(){
    let dragging=false,sx=0,sy=0,vb0=null;
    wrap.addEventListener('wheel',e=>{
      e.preventDefault(); if(!curVB)return;
      const rect=wrap.getBoundingClientRect(); if(rect.width===0)return;
      const mx=(e.clientX-rect.left)/rect.width, my=(e.clientY-rect.top)/rect.height;
      const k=e.deltaY>0?1.18:0.85;
      const vb=curVB.slice();
      const nw=Math.min(8000,Math.max(20,vb[2]*k)), nh=vb[3]*(nw/vb[2]);
      vb[0]+=(vb[2]-nw)*mx; vb[1]+=(vb[3]-nh)*my; vb[2]=nw; vb[3]=nh;
      setView(vb);
    },{passive:false});
    wrap.addEventListener('pointerdown',e=>{
      if(e.target.closest('.bub'))return; if(!curVB)return;
      dragging=true;sx=e.clientX;sy=e.clientY;vb0=curVB.slice();
      try{wrap.setPointerCapture(e.pointerId);}catch(_){}
    });
    wrap.addEventListener('pointermove',e=>{
      if(!dragging||!vb0)return;
      const rect=wrap.getBoundingClientRect(); if(rect.width===0)return;
      const vb=vb0.slice();
      vb[0]=vb0[0]-(e.clientX-sx)*(vb0[2]/rect.width);
      vb[1]=vb0[1]-(e.clientY-sy)*(vb0[3]/rect.height);
      setView(vb);
    });
    wrap.addEventListener('pointerup',e=>{dragging=false;vb0=null;try{wrap.releasePointerCapture(e.pointerId);}catch(_){}});
  })();

  /* 启动顺序：先主体，再府辖，再泛称（不互相清空） */
  buildMarkups();
  buildBubbles();
  buildFuxian();
  buildZones();
  buildStats();
  buildRank();
  buildNoplace();
  setView(vbOf(cfg.views[cfg.defaultView]));
  applyFilter();
}

/* ========== 7. 标签页（try/catch 隔离，某页出错不影响其他页） ========== */
const tabsEl=document.getElementById('tabs');
const pagesEl=document.getElementById('pages');
PAGES.forEach((cfg,i)=>{
  const btn=document.createElement('button');
  btn.textContent=cfg.tab;
  if(i===0)btn.classList.add('on');
  btn.addEventListener('click',()=>{
    [...tabsEl.children].forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    [...pagesEl.children].forEach(p=>p.classList.remove('on'));
    document.getElementById(cfg.id).classList.add('on');
  });
  tabsEl.appendChild(btn);

  const sec=document.createElement('section');
  sec.className='page'+(i===0?' on':'');
  sec.id=cfg.id;
  pagesEl.appendChild(sec);

  try{ createApp(sec,cfg); }
  catch(e){
    console.error('[render]',cfg.id,e);
    sec.innerHTML+=`<div style="color:#f472b6;padding:20px;font-size:13px">页面 ${cfg.id} 渲染出错：${e.message}</div>`;
  }
});
</script>
</body>
</html>
